<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 417" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <filter id="bandShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00625E" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
    <marker id="arrowRight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>

    <!-- 图标定义 -->
    <g id="ic-doc">
      <path d="M-7,-9 L7,-9 L7,9 L-7,9 Z" fill="none" stroke="#008883" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-4" y1="-4" x2="4" y2="-4" stroke="#008883" stroke-width="2" stroke-linecap="round"/>
      <line x1="-4" y1="0" x2="4" y2="0" stroke="#008883" stroke-width="2" stroke-linecap="round"/>
      <line x1="-4" y1="4" x2="2" y2="4" stroke="#008883" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="ic-template">
      <rect x="-8" y="-8" width="16" height="16" rx="2" fill="none" stroke="#008883" stroke-width="2"/>
      <line x1="-8" y1="-2" x2="8" y2="-2" stroke="#008883" stroke-width="2" stroke-linecap="round"/>
      <line x1="-8" y1="4" x2="8" y2="4" stroke="#008883" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="ic-understand">
      <circle cx="0" cy="0" r="8" fill="none" stroke="#008883" stroke-width="2"/>
      <circle cx="-2.5" cy="-1" r="1.5" fill="#008883"/>
      <circle cx="2.5" cy="-1" r="1.5" fill="#008883"/>
      <path d="M-5,4 Q0,8 5,4" fill="none" stroke="#008883" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="ic-style">
      <path d="M-8,8 L0,-8 L8,8 Z" fill="none" stroke="#008883" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="0" cy="1" r="2" fill="#008883"/>
    </g>
    <g id="ic-write">
      <path d="M-8,8 L-4,-4 L0,4 L4,-6 L8,8 Z" fill="none" stroke="#008883" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="ic-graphic">
      <rect x="-7" y="-7" width="14" height="14" rx="2" fill="none" stroke="#008883" stroke-width="2"/>
      <circle cx="0" cy="0" r="3" fill="none" stroke="#008883" stroke-width="2"/>
      <line x1="0" y1="-7" x2="0" y2="-3" stroke="#008883" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="3" x2="0" y2="7" stroke="#008883" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="ic-review">
      <path d="M-8,0 L-3,5 L8,-5" fill="none" stroke="#008883" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="ic-output">
      <rect x="-8" y="-7" width="16" height="14" rx="2" fill="none" stroke="#008883" stroke-width="2"/>
      <line x1="-4" y1="-7" x2="-4" y2="-3" stroke="#008883" stroke-width="2" stroke-linecap="round"/>
      <line x1="4" y1="-7" x2="4" y2="-3" stroke="#008883" stroke-width="2" stroke-linecap="round"/>
      <line x1="-4" y1="3" x2="-4" y2="7" stroke="#008883" stroke-width="2" stroke-linecap="round"/>
      <line x1="4" y1="3" x2="4" y2="7" stroke="#008883" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="ic-version">
      <rect x="-8" y="-7" width="16" height="14" rx="2" fill="none" stroke="#008883" stroke-width="2"/>
      <path d="M-5,2 L-2,-1 L2,1 L5,-2" fill="none" stroke="#008883" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="ic-chapter">
      <path d="M-7,-8 L7,-8 L7,8 L-7,8 Z" fill="none" stroke="#008883" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-7" y1="-2" x2="7" y2="-2" stroke="#008883" stroke-width="2" stroke-linecap="round"/>
      <line x1="-7" y1="3" x2="7" y2="3" stroke="#008883" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- 底部支撑平台 -->
  <rect x="16" y="352" width="1168" height="49" rx="8" fill="#00625E"/>
  <text x="36" y="382" font-size="18" fill="#FFFFFF" font-weight="700">人工智能平台</text>
  <rect x="210" y="366" width="100" height="22" rx="11" fill="#008883"/>
  <text x="260" y="381" font-size="14" fill="#FFFFFF" text-anchor="middle">大模型</text>
  <rect x="322" y="366" width="112" height="22" rx="11" fill="#008883"/>
  <text x="378" y="381" font-size="14" fill="#FFFFFF" text-anchor="middle">语义理解</text>
  <rect x="446" y="366" width="112" height="22" rx="11" fill="#008883"/>
  <text x="502" y="381" font-size="14" fill="#FFFFFF" text-anchor="middle">文本生成</text>
  <rect x="570" y="366" width="112" height="22" rx="11" fill="#008883"/>
  <text x="626" y="381" font-size="14" fill="#FFFFFF" text-anchor="middle">视觉理解</text>

  <!-- 层间箭头：底部平台 -> 输入层 -->
  <line x1="600" y1="352" x2="600" y2="340" stroke="#008883" stroke-width="2" marker-end="url(#arrowUp)"/>

  <!-- 输入层 -->
  <rect x="16" y="204" width="1168" height="124" rx="8" fill="#F3F9F9" filter="url(#bandShadow)"/>
  <rect x="16" y="204" width="150" height="124" rx="8" fill="#008883"/>
  <text x="91" y="250" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">输入</text>
  <text x="91" y="276" font-size="14" fill="#FFFFFF" text-anchor="middle">业务素材与模板</text>

  <!-- 业务素材卡片 -->
  <rect x="186" y="218" width="295" height="96" rx="6" fill="#FFFFFF" stroke="#A5D4D2" stroke-width="1"/>
  <use href="#ic-doc" x="222" y="252"/>
  <text x="248" y="246" font-size="19" fill="#153231" font-weight="700">业务素材</text>
  <text x="248" y="270" font-size="15" fill="#396A68">Word 方案、旧版 PPT</text>
  <text x="248" y="292" font-size="15" fill="#396A68">会议纪要、XMind 提纲</text>

  <!-- 单位模板卡片 -->
  <rect x="503" y="218" width="295" height="96" rx="6" fill="#FFFFFF" stroke="#A5D4D2" stroke-width="1"/>
  <use href="#ic-template" x="539" y="252"/>
  <text x="565" y="246" font-size="19" fill="#153231" font-weight="700">单位模板</text>
  <text x="565" y="270" font-size="15" fill="#396A68">版式、配色、字体</text>
  <text x="565" y="292" font-size="15" fill="#396A68">页面节奏</text>

  <!-- 输入层到中间层箭头 -->
  <line x1="600" y1="204" x2="600" y2="190" stroke="#008883" stroke-width="2" marker-end="url(#arrowUp)"/>

  <!-- 中间智能助手层 -->
  <rect x="16" y="76" width="1168" height="102" rx="8" fill="#D3EEED" filter="url(#bandShadow)"/>
  <rect x="16" y="76" width="150" height="102" rx="8" fill="#00625E"/>
  <text x="91" y="118" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">智能演示</text>
  <text x="91" y="144" font-size="14" fill="#FFFFFF" text-anchor="middle">文稿助手</text>

  <!-- 四张能力卡 -->
  <rect x="186" y="88" width="196" height="78" rx="6" fill="#FFFFFF" stroke="#A5D4D2" stroke-width="1"/>
  <use href="#ic-understand" x="222" y="116"/>
  <text x="246" y="112" font-size="19" fill="#153231" font-weight="700">材料理解</text>
  <text x="246" y="134" font-size="15" fill="#396A68">提炼要点</text>
  <text x="246" y="152" font-size="15" fill="#396A68">对齐口径</text>

  <line x1="382" y1="127" x2="398" y2="127" stroke="#008883" stroke-width="2" marker-end="url(#arrowRight)"/>

  <rect x="398" y="88" width="196" height="78" rx="6" fill="#FFFFFF" stroke="#A5D4D2" stroke-width="1"/>
  <use href="#ic-style" x="434" y="116"/>
  <text x="458" y="112" font-size="19" fill="#153231" font-weight="700">风格适配</text>
  <text x="458" y="134" font-size="15" fill="#396A68">识别模板版式配色</text>

  <line x1="594" y1="127" x2="610" y2="127" stroke="#008883" stroke-width="2" marker-end="url(#arrowRight)"/>

  <rect x="610" y="88" width="196" height="78" rx="6" fill="#FFFFFF" stroke="#A5D4D2" stroke-width="1"/>
  <use href="#ic-write" x="646" y="116"/>
  <text x="670" y="112" font-size="19" fill="#153231" font-weight="700">内容撰写</text>
  <text x="670" y="134" font-size="15" fill="#396A68">排大纲</text>
  <text x="670" y="152" font-size="15" fill="#396A68">逐页写正文</text>

  <line x1="806" y1="127" x2="822" y2="127" stroke="#008883" stroke-width="2" marker-end="url(#arrowRight)"/>

  <rect x="822" y="88" width="196" height="78" rx="6" fill="#FFFFFF" stroke="#A5D4D2" stroke-width="1"/>
  <use href="#ic-graphic" x="858" y="116"/>
  <text x="882" y="112" font-size="19" fill="#153231" font-weight="700">图形生成</text>
  <text x="882" y="134" font-size="15" fill="#396A68">结构图双版本输出</text>

  <!-- 全文连贯审查横条 -->
  <rect x="186" y="170" width="832" height="30" rx="6" fill="#F3F9F9" stroke="#A5D4D2" stroke-width="1"/>
  <use href="#ic-review" x="240" y="185"/>
  <text x="262" y="190" font-size="16" fill="#153231" font-weight="700">全文连贯审查</text>
  <text x="405" y="190" font-size="15" fill="#396A68">术语统一、数据前后一致</text>

  <!-- 中间层到输出层箭头 -->
  <line x1="600" y1="76" x2="600" y2="62" stroke="#008883" stroke-width="2" marker-end="url(#arrowUp)"/>

  <!-- 输出层 -->
  <rect x="16" y="16" width="1168" height="46" rx="8" fill="#F3F9F9" filter="url(#bandShadow)"/>
  <rect x="16" y="16" width="150" height="46" rx="8" fill="#008883"/>
  <text x="91" y="44" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">输出</text>

  <!-- 输出卡片：三张卡片加宽到 325 -->
  <rect x="186" y="24" width="325" height="30" rx="6" fill="#FFFFFF" stroke="#A5D4D2" stroke-width="1"/>
  <use href="#ic-output" x="220" y="39"/>
  <text x="244" y="43" font-size="18" fill="#153231" font-weight="700">成稿演示文稿</text>
  <text x="390" y="43" font-size="15" fill="#396A68">保留模板风格</text>

  <rect x="527" y="24" width="325" height="30" rx="6" fill="#FFFFFF" stroke="#A5D4D2" stroke-width="1"/>
  <use href="#ic-version" x="561" y="39"/>
  <text x="585" y="43" font-size="18" fill="#153231" font-weight="700">结构图两个版本</text>
  <text x="731" y="43" font-size="15" fill="#396A68">图片版/可编辑版</text>

  <rect x="868" y="24" width="301" height="30" rx="6" fill="#FFFFFF" stroke="#A5D4D2" stroke-width="1"/>
  <use href="#ic-chapter" x="902" y="39"/>
  <text x="926" y="43" font-size="18" fill="#153231" font-weight="700">加页加章</text>
  <text x="1023" y="43" font-size="15" fill="#396A68">目录、扉页自动联动</text>
</svg>