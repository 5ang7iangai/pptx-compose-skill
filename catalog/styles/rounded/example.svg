<svg viewBox="0 0 1600 612" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif">
  <defs>
    <filter id="s4" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(4,72,70,.10)"/>
    </filter>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 1.4 L9 5 L0 8.6 Z" fill="#007774"/>
    </marker>
    <g id="ic4-user">
      <circle r="18" fill="#007774"/>
      <circle cx="0" cy="-4.5" r="5" fill="#fff"/>
      <path d="M-8 10 C-7 3.2, 7 3.2, 8 10" fill="none" stroke="#fff" stroke-width="1.8"/>
    </g>
    <g id="ic4-brain">
      <circle r="18" fill="#007774"/>
      <path d="M-6-4.5 C-8-9, 0-10, 2.2-6.5 C5.5-10, 9-5.5, 5.5-2 C9 1, 3.2 8, -1 5.5 C-7 9, -9 1, -5.5-2Z" fill="none" stroke="#fff" stroke-width="1.5"/>
    </g>
    <g id="ic4-doc">
      <circle r="18" fill="#007774"/>
      <rect x="-5.5" y="-8" width="11" height="15" rx="1.5" fill="none" stroke="#fff" stroke-width="1.4"/>
      <path d="M-2.8-2.8 h5.6 M-2.8 1.2 h5.6 M-2.8 5.2 h3.4" stroke="#fff" stroke-width="1.2"/>
    </g>
    <g id="ic4-play">
      <circle r="18" fill="#065a58"/>
      <path d="M-3.5-6 L7 0 L-3.5 6 Z" fill="#fff"/>
    </g>
    <g id="ic4-edit">
      <circle r="18" fill="#b8954a"/>
      <path d="M-6 6 L-4.5-1 L4.5-8 L8-4.5 L-1 4.5 Z" fill="none" stroke="#fff" stroke-width="1.5"/>
    </g>
    <g id="ic4-mem">
      <circle r="18" fill="#065a58"/>
      <path d="M-5.5-7 h11 v15 l-5.5-3.4 -5.5 3.4 Z" fill="none" stroke="#fff" stroke-width="1.5"/>
    </g>
    <g id="ic4-ok">
      <circle r="18" fill="#2f7d4a"/>
      <path d="M-7 0 L-2 6 L8-7" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/>
    </g>
    <g id="ic4-tpl">
      <circle r="15" fill="#007774"/>
      <rect x="-5.5" y="-7" width="11" height="13.5" rx="1.3" fill="none" stroke="#fff" stroke-width="1.3"/>
    </g>
    <g id="ic4-link">
      <circle r="15" fill="#007774"/>
      <path d="M-3.5-2.2 a3.4 3.4 0 0 1 4.6 0 l1.1 1.1 M3.5 2.2 a3.4 3.4 0 0 1-4.6 0 l-1.1-1.1" fill="none" stroke="#fff" stroke-width="1.5"/>
    </g>
