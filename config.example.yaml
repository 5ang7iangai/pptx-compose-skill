# pptx-compose 大模型配置（示例）
# 拷贝为 config.yaml 后填入你自己的 API key 与接口地址。
# 查找顺序见 SKILL.md 开头。切勿把含真实密钥的 config.yaml 提交到公开仓库。

llm:
  # ── 主模型（文案 S1/S3/S4/S5、出图）──
  provider: openai           # openai：OpenAI 兼容接口；anthropic：Anthropic Messages API
  model: gpt-4o              # 按你的服务商填写模型名
  api_key: ${LLM_API_KEY}    # 推荐用环境变量；也可写明文（勿公开分享）
  base_url: https://api.example.com/v1   # 换成你的兼容接口地址；本地可如 http://localhost:11434/v1
  max_tokens: 16000           # 文案步骤的输出上限；出图固定用 16384
  temperature: 0.3
  thinking: ~                 # 推理模型的思考开关：不填沿用模型默认，false 关闭（出图总是关闭）

  # ── 视觉模型（可选，只用于 S2 模板视觉理解）──
  # 不配置则跳过 S2，其余步骤照常
  vision_model: ~             # 需要支持图片输入
  vision_base_url: ~          # 不填则和主模型 base_url 相同
  vision_api_key: ~           # 不填则和主模型 api_key 相同

  # ── 并发 ──
  max_concurrent: 5           # S4 逐页撰写、出图的并发上限，设为 1 则串行
  retry_delay_sec: 1.0        # 串行时每次调用后的等待秒数；遇到 429 自动退回串行
